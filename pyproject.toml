[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aura"
version = "0.1.0.dev0"
description = "AuraWork local-first agent CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "qWaitCrypto" }]
dependencies = [
  "agno>=2.3",
  "pydantic>=2.10",
  "httpx>=0.28",
  "openai>=1.100",
  "anthropic>=0.75",
  "strictyaml>=1.6",
  "mcp>=1.0,<2.0",
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
office = [
  "lxml>=5",
  "python-docx>=1.2",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "pypdf>=3",
  "pdfplumber>=0.11",
  "Pillow>=10",
  "pytesseract>=0.3",
  "pdf2image>=1.16",
  "reportlab>=4",
]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.23",
]

[project.scripts]
aura = "aura.cli:main"

[project.urls]
Repository = "https://github.com/qWaitCrypto/AuraWork"
Issues = "https://github.com/qWaitCrypto/AuraWork/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["aura*"]

[tool.setuptools.package-data]
aura = [
  "runtime/prompts/*.md",
  "runtime/event_schema_v0.2.md",
  "runtime/knowledge/README.md",
  "builtin/skills/**/*",
]
